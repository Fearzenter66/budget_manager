{% extends "base.html" %}

{% block extra_css %}
<style>
    .app-layout {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(ellipse at 20% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
            var(--bg);
    }

    .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        background: rgba(26, 35, 50, 0.8);
        backdrop-filter: blur(8px);
    }

    .app-header .logo {
        font-size: 1.5rem;
        margin-bottom: 0;
        text-decoration: none;
        color: var(--text);
    }

    .app-header .logo span {
        color: var(--accent);
    }

    .user-menu {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .username {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .btn-sm {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
    }

    .app-main {
        flex: 1;
        padding: 2rem;
    }

    .app-content {
        max-width: 56rem;
        margin: 0 auto;
    }

    .page-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .page-subtitle {
        color: var(--text-muted);
        font-size: 1.05rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="app-layout">
    <header class="app-header">
        <a href="{% url 'web:home' %}" class="logo">Кон<span>тур</span></a>
        <div class="user-menu">
            <span class="username">{{ username }}</span>
            <a href="{% url 'web:settings' %}" class="btn btn-secondary btn-sm">Настройки</a>
            <a href="{% url 'web:logout' %}" class="btn btn-primary btn-sm">Выйти</a>
        </div>
    </header>
    <main class="app-main">
        {% block app_content %}{% endblock %}
    </main>
</div>
{% endblock %}
