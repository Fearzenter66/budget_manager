<script>
    (function () {
        const deleteModal = document.getElementById('delete-modal');
        const deleteForm = document.getElementById('delete-form');
        const deleteMessage = document.getElementById('delete-message');
        const deleteCancel = document.getElementById('delete-cancel');
        const editModal = document.getElementById('edit-modal');

        document.querySelectorAll('.record-row').forEach((row) => {
            row.addEventListener('click', (event) => {
                if (event.target.closest('.delete-btn')) {
                    return;
                }
                window.location.href = row.dataset.editUrl;
            });
        });

        document.querySelectorAll('.delete-btn').forEach((button) => {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                deleteForm.action = button.dataset.deleteUrl;
                deleteMessage.textContent = button.dataset.deleteMessage;
                deleteModal.classList.add('is-open');
            });
        });

        function closeDeleteModal() {
            deleteModal.classList.remove('is-open');
        }

        deleteCancel.addEventListener('click', closeDeleteModal);
        deleteModal.addEventListener('click', (event) => {
            if (event.target === deleteModal) {
                closeDeleteModal();
            }
        });

        if (editModal) {
            const editCancel = document.getElementById('edit-cancel');
            function closeEditModal() {
                window.location.href = editModal.dataset.closeUrl;
            }
            if (editCancel) {
                editCancel.addEventListener('click', (event) => {
                    event.preventDefault();
                    closeEditModal();
                });
            }
            editModal.addEventListener('click', (event) => {
                if (event.target === editModal) {
                    closeEditModal();
                }
            });
        }

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') {
                return;
            }
            if (deleteModal.classList.contains('is-open')) {
                closeDeleteModal();
                return;
            }
            if (editModal && editModal.classList.contains('is-open')) {
                window.location.href = editModal.dataset.closeUrl;
            }
        });
    })();
</script>
